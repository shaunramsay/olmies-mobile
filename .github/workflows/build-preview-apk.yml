name: Build Preview APK

on:
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Full reviewed TEST commit SHA; owner dispatch authorizes this exact deployment/build'
        required: true
        type: string

jobs:
  security_gate:
    uses: ./.github/workflows/security-checks.yml
    permissions:
      contents: read

  build-android-preview-apk:
    needs: security_gate
    if: github.ref == 'refs/heads/test' && github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.approved_sha == github.sha && needs.security_gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Validate Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          eas whoami

      - name: Build Android preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive

name: Reusable security checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for workflow policy regression checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate TEST deployment gate and negative cases
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 scripts/security/test_deployment_gate.py
      - name: Secret scan (tracked files)
        run: python3 scripts/security/scan-secrets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Unit and security tests
        run: npm test
      - name: Release config blocks the overlay permission
        run: |
          npx expo config --type public --json > /tmp/expo.json
          python3 -c "import json;d=json.load(open('/tmp/expo.json'));assert 'android.permission.SYSTEM_ALERT_WINDOW' in d['android'].get('blockedPermissions',[]), 'SYSTEM_ALERT_WINDOW not blocked'"
      - name: Production config never accepts unsigned OTA updates
        env:
          EAS_BUILD_PROFILE: production
        run: |
          npx expo config --type public --json > /tmp/expo-prod.json
          node -e "const u=require('/tmp/expo-prod.json').updates||{};const {isSafeUpdatesConfig}=require('./src/utils/updatePolicy');if(!isSafeUpdatesConfig(u)){console.error('Unsigned OTA updates enabled in production config');process.exit(1)}"
      - name: Release config sends credentials only to an approved API destination
        env:
          EAS_BUILD: 'true'
          EAS_BUILD_PROFILE: preview
        run: |
          EXPO_PUBLIC_API_URL=https://olmies-ai-test.up.railway.app npx expo config --type public --json > /tmp/expo-dest.json
          node -e "const d=require('/tmp/expo-dest.json');if(d.extra.apiBaseUrl!=='https://olmies-ai-test.up.railway.app'){console.error('approved TEST API not preserved');process.exit(1)}"
          for refused in https://olmies-ai-production.up.railway.app http://olmies-ai-test.up.railway.app https://unapproved.example ""; do
            if EXPO_PUBLIC_API_URL="$refused" npx expo config --type public --json > /dev/null 2>&1; then
              echo "Release config accepted an unapproved API destination: ${refused:-<unset>}" >&2
              exit 1
            fi
          done

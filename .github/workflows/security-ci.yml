name: Mobile Security CI

# Unit tests and secret scan; no app publication. TEST pushes call the same reusable
# gate from build-preview-apk.yml, avoiding a duplicate CI run for the same push.
on:
  push:
    branches: [dev, main, production-2]
  pull_request:
    branches: [dev, test, main, production-2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    uses: ./.github/workflows/security-checks.yml
    permissions:
      contents: read
